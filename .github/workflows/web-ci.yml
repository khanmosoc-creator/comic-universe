name: web-ci

# Type-checks and builds the static site with the real toolchain (Vite + TypeScript).
# On the first push it also generates apps/web/package-lock.json and commits it,
# so Cloudflare Pages can use the reproducible `npm ci` install.

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['apps/web/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/web/.node-version

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          # No 404.html: Cloudflare Pages then serves index.html for app routes (SPA mode).
          test ! -f dist/404.html
          # No third-party origins referenced from the built HTML/JS/CSS.
          if grep -rEo "https?://[a-zA-Z0-9.-]+" dist --include=*.html --include=*.js --include=*.css \
               | grep -vE "www\.w3\.org|react\.dev|reactjs\.org|www\.cloudflare\.com" | sort -u | grep .; then
            echo "Unexpected external URL in build output (see above)"; exit 1
          fi

      - name: Commit generated lockfile
        if: steps.install.outputs.created == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(web): add package-lock.json generated by CI"
          git push
